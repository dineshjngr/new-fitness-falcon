<!-- Shared Reusable Post Card Component Pattern -->
<article class="post-card">
  <a href="/blogs/sample-post/">
    <img src="assets/images/sample-thumb.jpg" alt="Article Title" class="post-card-thumb" loading="lazy" />
  </a>
  <div class="post-card-body">
    <a href="/category/fitness/" class="category-badge">Fitness</a>
    <h3 class="post-card-title">
      <a href="/blogs/sample-post/">Article Title</a>
    </h3>
    <div class="post-card-meta">
      <span><i class="fal fa-calendar-alt"></i> September 30, 2026</span>
      <span><i class="fal fa-clock"></i> 5 min read</span>
    </div>
  </div>
</article>
