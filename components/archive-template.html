<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FV9WZ1XFE0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-FV9WZ1XFE0');
    </script>

    <!-- Primary Meta Tags -->
    <title>{{META_TITLE}}</title>
    <meta name="title" content="{{META_TITLE}}" />
    <meta name="description" content="{{META_DESCRIPTION}}" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    {{PAGINATION_REL_LINKS}}
    
    <!-- Open Graph / Facebook -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{META_TITLE}}" />
    <meta property="og:description" content="{{META_DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:site_name" content="The Fitness Falcon" />
    <meta property="og:image" content="https://thefitnessfalcon.com/assets/images/1.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@fitnessfalcon_" />
    <meta name="twitter:title" content="{{META_TITLE}}" />
    <meta name="twitter:description" content="{{META_DESCRIPTION}}" />

    <!-- Favicon -->
    <link rel="icon" href="/assets/images/cropped-Untitled-design-14-32x32.png" sizes="32x32" />
    <link rel="icon" href="/assets/images/cropped-Untitled-design-14-192x192.png" sizes="192x192" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/all.min.css" />
    <link rel="stylesheet" href="/assets/css/benqu-style.css" />
    <link rel="stylesheet" href="/assets/css/post-style.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
    <link rel="stylesheet" href="/assets/css/custom-style.css" />
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="falcon-site-wrapper">
<!-- shared:header:start -->
<!-- shared:header:end -->

<main id="main-content" class="falcon-main-layout">
    <div class="container">
        <!-- Reusable Breadcrumbs -->
        {{BREADCRUMBS_HTML}}

        <!-- Archive Hero / Header Banner -->
        {{ARCHIVE_HEADER_HTML}}

        <!-- Category Filter Bar (Optional, for browsing categories) -->
        {{CATEGORY_FILTER_BAR_HTML}}

        <!-- Featured Story (Optional, e.g. on blog archive) -->
        {{FEATURED_CARD_HTML}}

        <!-- In-Page Search & Filter Row -->
        {{IN_PAGE_FILTER_HTML}}

        <div class="row">
            <!-- Articles Grid Column -->
            <div class="{{GRID_COL_CLASS}}">
                <div class="row" id="archiveArticlesGrid">
                    {{ARTICLES_GRID_HTML}}
                </div>
                {{PAGINATION_HTML}}
            </div>

            <!-- Sidebar (Optional, e.g. on category archives) -->
            {{SIDEBAR_HTML}}
        </div>
    </div>
</main>

<!-- shared:footer:start -->
<!-- shared:footer:end -->
</div>

<!-- JS Dependencies -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/popper.min.js"></script>
<script src="/assets/js/bootstrap.min.js"></script>
<script src="/assets/js/owl.carousel.min.js"></script>
<script src="/assets/js/search-results.js"></script>
<script src="/assets/js/falcon-search-data.js"></script>
<script src="/assets/js/falcon-core.js"></script>
</body>
</html>
