<!-- Shared Reusable Empty State Component -->
<div class="falcon-empty-state" role="status">
  <div class="falcon-empty-icon">
    <i class="{{ICON_CLASS}}" aria-hidden="true"></i>
  </div>
  <h3 class="falcon-empty-title">{{TITLE}}</h3>
  <p class="falcon-empty-description">{{DESCRIPTION}}</p>
  <a href="{{ACTION_URL}}" class="falcon-btn falcon-btn-primary falcon-btn-sm">{{ACTION_TEXT}}</a>
</div>
