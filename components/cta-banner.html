<!-- Shared Reusable Call-to-Action (CTA) Component Pattern -->
<section class="falcon-cta" aria-labelledby="cta-heading">
  <div class="falcon-container">
    <div style="max-width: 600px;">
      <span class="falcon-cta-eyebrow">STAY INFORMED</span>
      <h2 id="cta-heading" class="falcon-cta-title">Subscribe for Weekly Fitness &amp; Wellness Insights</h2>
      <p class="falcon-cta-description">Evidence-based health tips, nutrition guidance, and workout strategies delivered straight to your inbox.</p>
      <form class="falcon-newsletter-form" onsubmit="event.preventDefault(); alert('Thank you for subscribing!');">
        <input type="email" class="falcon-newsletter-input" placeholder="Enter your email address" required aria-label="Email address" />
        <button type="submit" class="falcon-btn falcon-btn-primary">Subscribe</button>
      </form>
    </div>
  </div>
</section>
