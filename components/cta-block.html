<!-- Shared Reusable Call-to-Action Block Component -->
<section class="falcon-cta" aria-label="Call to action">
  <div class="container">
    <div class="falcon-cta-inner">
      <span class="falcon-cta-eyebrow">{{EYEBROW}}</span>
      <h2 class="falcon-cta-title">{{TITLE}}</h2>
      <p class="falcon-cta-description">{{DESCRIPTION}}</p>
      <div class="falcon-cta-actions">
        <a href="{{BUTTON_URL}}" class="falcon-btn falcon-btn-primary falcon-btn-lg">{{BUTTON_TEXT}}</a>
      </div>
    </div>
  </div>
</section>
