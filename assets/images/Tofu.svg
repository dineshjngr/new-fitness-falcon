<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="350" rx="20" fill="url(#grad)" />

  <!-- Decorative Background Circles -->
  <circle cx="880" cy="175" r="160" fill="white" fill-opacity="0.04" />
  <circle cx="880" cy="175" r="110" fill="white" fill-opacity="0.06" />
  <circle cx="880" cy="175" r="60" fill="white" fill-opacity="0.08" />
  <path d="M-20,280 Q300,180 600,320 T1020,240" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="4" />

  <!-- Left Content Column -->
  <!-- Brand Eyebrow -->
  <g transform="translate(50, 50)">
    <rect width="240" height="28" rx="14" fill="white" fill-opacity="0.15" />
    <text x="120" y="18" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">THE FITNESS FALCON GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="135" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Organic Tofu</text>

  <!-- Subtitle -->
  <text x="50" y="172" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0">Complete Plant-Based Protein</text>

  <!-- Protein Highlight Banner -->
  <g transform="translate(50, 205)" filter="url(#shadow)">
    <rect width="280" height="46" rx="12" fill="#34d399" />
    <text x="140" y="29" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">20g Protein / 100g</text>
  </g>

  <!-- Key Benefit Pills -->
  <g transform="translate(50, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="32" rx="16" fill="white" fill-opacity="0.12" />
    <text x="75" y="21" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">✓ All 9 Amino Acids</text>

    <!-- Pill 2 -->
    <rect x="165" y="0" width="150" height="32" rx="16" fill="white" fill-opacity="0.12" />
    <text x="240" y="21" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Calcium Rich</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="160" height="32" rx="16" fill="white" fill-opacity="0.12" />
    <text x="410" y="21" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Zero Cholesterol</text>
  </g>

  <!-- Right Decorative Nutrition Seal -->
  <g transform="translate(850, 175)">
    <circle cx="0" cy="0" r="70" fill="white" fill-opacity="0.12" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="56" fill="#064e3b" />
    <text x="0" y="-10" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1.5" text-anchor="middle">100%</text>
    <text x="0" y="12" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    <text x="0" y="28" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">NUTRITION</text>
  </g>
</svg>